<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>سبحة إلكترونية</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a2620">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="السبحة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg-deep:#0a2620;--bg-mid:#0f3830;--gold:#c9a24b;--gold-soft:#e4c77e;--cream:#f2ead9;--cream-dim:#cfc4ab;--bead-shadow:rgba(0,0,0,.45)}
  *{box-sizing:border-box} html,body{margin:0;padding:0;height:100%;background:radial-gradient(circle at 50% 15%,var(--bg-mid),var(--bg-deep) 70%);color:var(--cream);font-family:'Tajawal',sans-serif;overflow:hidden}
  .stars{position:fixed;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.25),transparent),radial-gradient(1px 1px at 70% 60%,rgba(255,255,255,.18),transparent),radial-gradient(1.5px 1.5px at 40% 80%,rgba(255,255,255,.2),transparent),radial-gradient(1px 1px at 85% 20%,rgba(255,255,255,.15),transparent),radial-gradient(1px 1px at 55% 40%,rgba(255,255,255,.12),transparent);pointer-events:none}
  .wrap{position:relative;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:28px 20px 34px} header{text-align:center} header h1{font-family:'Reem Kufi',sans-serif;font-weight:500;font-size:clamp(22px,6vw,30px);margin:0 0 4px;color:var(--gold-soft);letter-spacing:.5px}.dhikr-label{font-size:15px;color:var(--cream-dim);min-height:20px}.targets{display:flex;gap:10px;margin-top:14px}.targets button{background:transparent;border:1px solid rgba(201,162,75,.4);color:var(--cream-dim);font-family:'Tajawal',sans-serif;font-size:14px;padding:6px 16px;border-radius:20px;cursor:pointer;transition:border-color .2s,color .2s,background .2s}.targets button.active{border-color:var(--gold);color:var(--bg-deep);background:var(--gold-soft);font-weight:700}
  .center-area{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}.count-display{font-family:'Reem Kufi',sans-serif;font-size:clamp(52px,18vw,84px);color:var(--cream);line-height:1;font-variant-numeric:tabular-nums}.progress-ring{position:relative;width:min(58vw,260px);height:min(58vw,260px)}.progress-ring svg{transform:rotate(-90deg);width:100%;height:100%}.progress-ring circle{fill:none;stroke-width:6}.ring-bg{stroke:rgba(201,162,75,.15)}.ring-fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .25s ease}.bead-btn{position:absolute;inset:0;margin:auto;width:62%;height:62%;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 35% 30%,#4a3418,#2b1d0d 55%,#17100a 100%);box-shadow:0 10px 26px var(--bead-shadow),inset 0 2px 6px rgba(255,255,255,.15),inset 0 -6px 14px rgba(0,0,0,.5);-webkit-tap-highlight-color:transparent;transition:transform .08s ease}.bead-btn:active{transform:scale(.93)}.cycle-note{font-size:13px;color:var(--cream-dim);letter-spacing:.3px}footer{display:flex;gap:16px;align-items:center}.reset-btn{background:transparent;border:1px solid rgba(242,234,217,.3);color:var(--cream-dim);font-family:'Tajawal',sans-serif;font-size:14px;padding:9px 22px;border-radius:22px;cursor:pointer;transition:border-color .2s,color .2s}.reset-btn:hover{border-color:var(--cream);color:var(--cream)}.vibrate-toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--cream-dim);cursor:pointer;user-select:none}.vibrate-toggle input{accent-color:var(--gold)}
</style>
</head><body><div class="stars"></div><div class="wrap"><header><h1>السبحة الإلكترونية</h1><div class="dhikr-label" id="dhikrLabel">سبحان الله</div><div class="targets" id="targets"><button data-target="33" class="active">٣٣</button><button data-target="99">٩٩</button><button data-target="100">١٠٠</button><button data-target="0">بلا حد</button></div></header><div class="center-area"><div class="progress-ring"><svg viewBox="0 0 120 120"><circle class="ring-bg" cx="60" cy="60" r="52"></circle><circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"></circle></svg><button class="bead-btn" id="beadBtn" aria-label="عدّ"></button></div><div class="count-display" id="countDisplay">0</div><div class="cycle-note" id="cycleNote"></div></div><footer><button class="reset-btn" id="resetBtn">إعادة تصفير</button><label class="vibrate-toggle"><input type="checkbox" id="vibrateToggle" checked>اهتزاز</label></footer></div>
<script>(function(){const dhikrList=["سبحان الله","الحمد لله","الله أكبر","لا إله إلا الله","أستغفر الله"],arabicDigits=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];function toArabicNumber(n){return String(n).split('').map(ch=>/[0-9]/.test(ch)?arabicDigits[ch]:ch).join('')}let count=0,cyclesCompleted=0,target=33;const countDisplay=document.getElementById('countDisplay'),dhikrLabel=document.getElementById('dhikrLabel'),cycleNote=document.getElementById('cycleNote'),beadBtn=document.getElementById('beadBtn'),resetBtn=document.getElementById('resetBtn'),vibrateToggle=document.getElementById('vibrateToggle'),targetButtons=document.querySelectorAll('.targets button'),ringFg=document.getElementById('ringFg'),circumference=2*Math.PI*52;function updateRing(){if(target===0){ringFg.style.strokeDashoffset=0;return}const progress=(count%target)/target;ringFg.style.strokeDashoffset=circumference*(1-progress)}function updateDhikr(){dhikrLabel.textContent=dhikrList[count%dhikrList.length]}function updateCycleNote(){cycleNote.textContent=target!==0&&cyclesCompleted>0?'عدد الأشواط المكتملة: '+toArabicNumber(cyclesCompleted):''}function render(){countDisplay.textContent=toArabicNumber(count);updateDhikr();updateRing();updateCycleNote()}function tick(){count++;if(target!==0&&count%target===0){cyclesCompleted++;if(vibrateToggle.checked&&navigator.vibrate)navigator.vibrate([40,40,80])}else if(vibrateToggle.checked&&navigator.vibrate)navigator.vibrate(12);render()}beadBtn.addEventListener('click',tick);resetBtn.addEventListener('click',function(){count=0;cyclesCompleted=0;render()});targetButtons.forEach(function(btn){btn.addEventListener('click',function(){targetButtons.forEach(b=>b.classList.remove('active'));btn.classList.add('active');target=parseInt(btn.getAttribute('data-target'),10);count=0;cyclesCompleted=0;render()})});document.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='Enter'){e.preventDefault();tick()}});render()})();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));</script></body></html>
